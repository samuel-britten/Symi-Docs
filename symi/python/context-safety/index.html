<!DOCTYPE html>
<html id="doc" class="h-full w-full" lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Symi Documentation</title>
        <link rel="icon" type="image/png" href="/symi/assets/site/logo_bright.png">
        <link href="/symi/assets/site/styles.css" rel="stylesheet" />
        <link href="/symi/assets/site/vendor/katex/katex.min.css" rel="stylesheet" />
        <script src="/symi/assets/site/vendor/marked/marked.umd.js"></script>
        <script src="/symi/assets/site/vendor/katex/katex.min.js"></script>
        <script src="/symi/assets/site/vendor/katex/auto-render.min.js"></script>

        <template id="documentation-language-selector_">
            <div class="symi-documentation-language-selector relative">
                <button type="button" class="symi-documentation-language-button flex w-full items-center justify-between rounded-md border border-symi-lowlight px-3 py-2 text-left" aria-haspopup="listbox" aria-expanded="false">
                    <span class="symi-documentation-language-label"></span>
                    <span aria-hidden="true">▾</span>
                </button>
                <ul class="symi-documentation-language-list absolute left-0 right-0 z-20 mt-1 hidden rounded-md border border-symi-lowlight bg-symi-bg-secondary p-1 shadow-lg" role="listbox"></ul>
            </div>
        </template>

        <template id="documentation-language-option_">
            <li role="option"><a class="symi-documentation-language-option block rounded px-2 py-1" tabindex="-1"><span class="symi-documentation-language-selected mr-1" aria-hidden="true"></span></a></li>
        </template>

        <template id="documentation-search_">
            <section class="symi-documentation-search mb-6" aria-label="Search documentation">
                <label class="mb-1 block text-xs opacity-70" for="symi-documentation-search-input">Search</label>
                <div class="flex gap-1">
                    <input id="symi-documentation-search-input" class="min-w-0 grow rounded-md border border-symi-lowlight bg-symi-bg-tertiary px-2 py-1" type="search" autocomplete="off" placeholder="Search capabilities" />
                    <button type="button" class="symi-documentation-search-scope rounded-md border border-symi-lowlight px-2 py-1 text-xs" aria-pressed="false">All</button>
                </div>
                <div class="symi-documentation-search-status mt-1 text-xs opacity-70" role="status" aria-live="polite"></div>
                <ul class="symi-documentation-search-results mt-2 hidden" role="listbox"></ul>
            </section>
        </template>

        <template id="documentation-search-result_">
            <li role="option" class="symi-documentation-search-result rounded-md px-2 py-1">
                <a class="symi-documentation-search-result-link block">
                    <span class="symi-documentation-search-result-name block font-['katex-code']"></span>
                    <span class="symi-documentation-search-result-meta block text-xs opacity-60"></span>
                </a>
            </li>
        </template>

        <template id="documentation-navigation-section_">
            <li class="symi-documentation-section">
                <button type="button" class="symi-documentation-section-toggle flex w-full items-center gap-1 text-left" aria-expanded="false">
                        <span class="symi-documentation-chevron" aria-hidden="true">▸</span>
                    <span class="symi-documentation-section-label"></span>
                </button>
                <ul class="symi-documentation-section-entries hidden"></ul>
            </li>
        </template>

        <template id="documentation-navigation-category_">
            <li class="symi-documentation-category mb-3">
                <h2 class="mb-1 text-sm font-semibold">
                    <button type="button" class="symi-documentation-category-toggle flex w-full items-center gap-1 text-left" aria-expanded="false">
                        <span class="symi-documentation-chevron" aria-hidden="true">▸</span>
                        <span class="symi-documentation-category-label"></span>
                    </button>
                </h2>
                <ul class="symi-documentation-category-sections space-y-1"></ul>
            </li>
        </template>

        <template id="documentation-navigation-entry_">
            <li><a class="symi-documentation-entry-link text-sm font-['katex-code']"></a></li>
        </template>

        <template id="documentation-navigation-plain_">
            <li class="pl-4"><a class="symi-documentation-plain-link"></a></li>
        </template>

        <template id="documentation-navigation-list_">
            <ul></ul>
        </template>
    </head>
    <body id="body" class="bg-symi-bg-tertiary text-symi-text h-full overflow-hidden">
        <div id="documentation_layout" class="flex h-full">
            <nav id="documentation_sidebar" class="relative w-72 shrink-0 h-full overflow-y-auto bg-symi-bg-secondary p-6">
                <a href="/symi/" class="mb-6 flex items-center gap-3">
                    <img src="/symi/assets/site/logo_slightly_bright_bordered_mid.png" alt="Symi" style="width: 40px; height: 40px;">
                    <span class="text-symi-highlight text-lg font-semibold">Symi Docs</span>
                </a>
                <div id="documentation_language_selector" class="mb-5"></div>
                <div id="documentation_search"></div>
                <div id="documentation_navigation" class="symi-documentation-navigation"></div>
            </nav>
            <main id="documentation_main" class="relative grow h-full overflow-y-auto">
                <div id="documentation_layer_notice" class="mx-auto max-w-3xl px-8 pt-5 text-sm"><p id="documentation_layer_text"></p><p id="documentation-unavailable-notice" class="hidden"></p></div>
                <article id="documentation_content" class="symi-documentation-content max-w-3xl mx-auto px-8 py-10"></article>
            </main>
        </div>
        <script type="module" src="/symi/assets/site/documentation.js"></script>
    </body>
</html>
